name: geoloc_app
description: "Geoloc - A hyper-local social media app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Authentication
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9

  # Networking
  dio: ^5.4.0

  # Local Storage
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Media
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  cached_network_image: ^3.3.1
  # video_player: ^2.8.2  # re-enable when video posts ship

  # Push Notifications (uncomment after adding GoogleService-Info.plist)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.10

  # UI
  flutter_svg: ^2.0.9
  # NOTE: project ships its own LoadingShimmer widget; the `shimmer` package
  # is intentionally *not* a dependency.
  # NOTE: pagination + pull-to-refresh use built-in Flutter widgets;
  # `pull_to_refresh` and `infinite_scroll_pagination` were removed.

  # Utils
  intl: ^0.18.1
  timeago: ^3.6.1

  # Navigation
  go_router: ^13.1.0

  # Fonts
  google_fonts: ^6.2.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Assets folder for images, icons, etc.
  assets:
    - assets/images/
    - assets/icons/
