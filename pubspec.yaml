name: geoloc_app
description: "Geoloc - A hyper-local social media app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Authentication
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # State Management
  flutter_riverpod: ^2.4.9

  # Networking
  dio: ^5.4.0
  cryptography: ^2.7.0

  # Local Storage
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # Location
  geolocator: ^10.1.0

  # Media
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  cached_network_image: ^3.3.1
  # video_player: ^2.8.2  # re-enable when video posts ship

  # Push Notifications
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

  # UI
  # cupertino_native_plus: ^0.0.9
  # NOTE: loading placeholders use the `shimmer` package.
  # NOTE: pagination + pull-to-refresh use built-in Flutter widgets;
  # `pull_to_refresh` and `infinite_scroll_pagination` were removed.

  # Utils
  timeago: ^3.6.1

  # Navigation
  go_router: ^13.1.0
  app_links: ^6.3.4

  # Fonts
  google_fonts: ^6.2.1
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets folder for images, icons, etc.
  assets:
    - assets/images/
    - assets/icons/
