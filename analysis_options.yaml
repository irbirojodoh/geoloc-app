# Static analysis configuration for Geoloc.
#
# Inherits the recommended Flutter lint set and enables additional rules
# that catch correctness/perf issues. Style-only rules
# (sort_constructors_first, require_trailing_commas, strict-inference) are
# intentionally NOT enabled yet — they would generate ~100 churn issues on
# a brownfield codebase. Re-evaluate once the typed-Dio migration lands.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
  language:
    strict-casts: true
  errors:
    # Treat security-sensitive issues as errors so CI fails fast.
    avoid_print: error
    invalid_annotation_target: ignore

linter:
  rules:
    # Style — small, high-signal subset
    prefer_single_quotes: true
    use_super_parameters: true

    # Correctness / performance
    avoid_print: true
    avoid_unnecessary_containers: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    unnecessary_lambdas: true
    unnecessary_late: true
    unnecessary_null_checks: true
    unnecessary_parenthesis: true
